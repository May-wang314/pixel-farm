  for (let gy = 0; gy < h; gy++) for (let gx = 0; gx < w; gx++) {

  const key = 'f' + (L ? 1 : 0) + (Rr ? 1 : 0) + (U ? 1 : 0) + (D ? 1 : 0) + season;

  const g = G(16, 20);

// 矿洞（装饰）
function buildCave(season) {
  const g = G(66, 50), R = mulberry(77);
  const blobs = [[33, 30, 30], [14, 36, 14], [52, 36, 14], [33, 14, 18]];
  const ins = (x, y, sc, ox = 0, oy = 0) => blobs.some(b => { const dx = x - b[0] - ox, dy = (y - b[1] - oy) * 1.25; return dx * dx + dy * dy <= (b[2] * sc) * (b[2] * sc); });
  for (let y = 0; y < 50; y++) for (let x = 0; x < 66; x++) {
    if (!ins(x, y, 1)) continue;
    let c = '#5a6988'; if (ins(x, y, 0.85, -3, -4)) c = '#8b9bb4'; if (ins(x, y, 0.45, -6, -9)) c = '#c0cbdc';
    if (R() < 0.08) c = '#3a4466';
    g.p(x, y, c);
  }
  if (season === 3) for (const b of blobs) for (let x = b[0] - b[2] + 4; x < b[0] + b[2] - 4; x++) for (let y = 0; y < 50; y++) if (ins(x, y, 1)) { g.p(x, y, '#ffffff'); g.p(x, y + 1, '#e6edf5'); break; }
  // 洞口
  g.ell(33, 40, 11, 10, '#262b44'); g.ell(33, 41, 9, 9, '#181425'); g.r(22, 41, 23, 9, '#181425');
  g.r(20, 30, 3, 20, '#8a5a3b'); g.r(44, 30, 3, 20, '#8a5a3b'); g.r(19, 29, 29, 3, '#733e39'); g.r(19, 29, 29, 1, '#b07a52');
  // 铁轨
  g.r(26, 46, 2, 4, '#5a6988'); g.r(39, 46, 2, 4, '#5a6988'); for (let y = 44; y < 50; y += 2) g.r(25, y, 17, 1, '#733e39');
  const c = outlined(g.c); return c;
}

function xpNeed(lv) { return Math.round(25 * Math.pow(lv, 1.6)); }
const MAX_LV = 30;
function unlocksAt(lv) {
  const u = [];
  for (const k in CROPS) if (CROPS[k].lv === lv) u.push({ icon: k, name: CROPS[k].name + '种子' });
  for (const k in ANIMALS) if (ANIMALS[k].lv === lv) u.push({ icon: ANIMALS[k].product, name: ANIMALS[k].name });
  for (const k in MACHINES) if (MACHINES[k].lv === lv) u.push({ icon: MACHINES[k].recipes[0].out, name: MACHINES[k].name });
  for (const s of SHOP_PLACE) if (s.lv === lv) u.push({ icon: s.id, name: ITEMS[s.id].name, place: true });
  for (const s of SHOP_SUPPLY) if (s.lv === lv) u.push({ icon: s.id, name: ITEMS[s.id].name });
  for (const s of UPGRADES) if (s.lv === lv) u.push({ icon: 't_can2', name: s.name });
  for (const p of PLOTS) if (p.lv === lv && p.cost) u.push({ icon: 'u_up', name: '可扩建农田' });
  if (lv === 2) u.push({ icon: 't_rod', name: '鱼竿' });
  return u;
}

function mineOreTable(f) {
  const t = [['stone', 8], ['coal', 16], ['saltpeter', 12], ['copper', 16]];
  if (f >= 3) t.push(['quartz', 6]);
  if (f >= 4) t.push(['iron', 12]);
  if (f >= 6) t.push(['amethyst', 5]);
  if (f >= 8) t.push(['gold', 7]);
  if (f >= 10) t.push(['gem', 3]);
  if (f >= 12) t.push(['ruby', 2]);
  if (f >= 14) t.push(['emerald', 2]);
  if (f >= 18) t.push(['diamond', 1.2]);
  return t;
}

  if (S.lv >= 5) pool.push('ore_gold');
  if (Object.values(S.objs).some(o => o.t === 'beehive')) pool.push('honey');
  if (S.lv >= 2) pool.push('fish_crucian', 'fish_carp');
  if (S.lv >= 4) pool.push('fish_bass');
  if (S.lv >= 2) pool.push('coal', 'saltpeter');

// ---------------- 每帧更新 ----------------
function mobMove(m, vx, vy, dt) {

function updateCombat(dt) {

  const st = playerStats();
  if (S.hp === undefined || S.hp > st.maxHp) S.hp = Math.min(S.hp === undefined ? st.maxHp : S.hp, st.maxHp);
  const reg = regionAt(P.x, P.y);

      else if (m.type === 'bat') { const s = Math.sin(m.ph * 5) * 0.8; vx = (dx / d + -dy / d * s) * m.spd; vy = (dy / d + dx / d * s) * m.spd; }
      else if (m.type === 'ghost') { const want = d > 80 ? 1 : d < 50 ? -1 : 0; vx = dx / d * m.spd * want + Math.cos(m.ph) * 10; vy = dy / d * m.spd * want + Math.sin(m.ph * 1.3) * 10; m.cd -= dt; if (m.cd <= 0 && !m.boss) { m.cd = 2.2; enemyShot(m, Math.atan2(dy, dx), 70, 'fire'); } }

      if (m.slam > 0) { m.slam -= dt; vx = vy = 0; if (m.slam <= 0) { sfx('boom'); FX.flash = 0.2; FX.parts.push({ x: m.x, y: m.y - 4, ring: 1, life: 0.5, t: 0, col: '#f77622', rmax: 44 }); if (dist(px, py, m.x, m.y - 5) < 46) playerHurt(m.dmg * 1.3, m.x, m.y); } }
      if (m.skillT <= 0) {

    }

    const p = PROJ[i];

    let gone = p.life <= 0 || !walkable(Math.floor(p.x / TS), Math.floor(p.y / TS)) && S.ground[idx(Math.floor(p.x / TS), Math.floor(p.y / TS))] === GR.CAVEWALL;
    if (!gone && p.enemy) { if (dist(p.x, p.y, px, py) < 7) { playerHurt(p.dmg, p.x - p.vx, p.y - p.vy); gone = true; } }

  }
}

'use strict';
// ================= 星露谷式生活系统：品质 / 技能 / 体力 / 季节作物 / 好感度 / 节日 / 收集包 =================

// ---------------- 物品品质（普通 / 银星 / 金星） ----------------
const QUAL_MUL = [1, 1.25, 1.5], QUAL_NAME = ['普通', '银星', '金星'];
function qArr(id) { if (!S.q) S.q = {}; return S.q[id] || (S.q[id] = [0, 0]); }
function qCount(id, q) { const a = S.q && S.q[id]; if (!q) return cnt(id) - (a ? a[0] + a[1] : 0); return a ? a[q - 1] : 0; }
function qTidy(id) { if (S.q && S.q[id] && (!S.inv[id] || (S.q[id][0] <= 0 && S.q[id][1] <= 0))) delete S.q[id]; }
// 用掉物品时先用普通的，再用银星，最后金星（S.inv 由调用方扣）
function qConsume(id, n) {
  const a = S.q && S.q[id]; if (!a) return;
  let left = n - Math.min(n, Math.max(0, cnt(id) - a[0] - a[1]));
  const s = Math.min(a[0], left); a[0] -= s; left -= s;
  const g = Math.min(a[1], left); a[1] -= g;
}
// 出售时先卖金星，再银星，最后普通；返回金币
function sellItems(id, n) {
  if (cnt(id) < n) return 0;
  const a = S.q && S.q[id], base = ITEMS[id].sell;
  let g = 0, s = 0;
  if (a) { g = Math.min(a[1], n); s = Math.min(a[0], n - g); a[1] -= g; a[0] -= s; }
  const normal = n - g - s;
  S.inv[id] -= n; if (S.inv[id] <= 0) delete S.inv[id]; qTidy(id);
  return Math.round(base * (normal + s * QUAL_MUL[1] + g * QUAL_MUL[2]));
}
function cropQuality(i) {
  const lv = skillLv('farm'), f = S.fert[i] ? 1 : 0;
  const r = Math.random();
  if (r < 0.01 + lv * 0.02 + f * 0.12) return 2;
  if (r < 0.12 + lv * 0.04 + f * 0.25) return 1;
  return 0;

// ================= 戴夫潜水员式潜水：横版海洋、深度、氧气=生命、负重、鱼叉拉扯 =================
const DV = { on: false };
const DV_W = 360, DV_SURF = 40, DV_PXM = 4, DV_MAXM = 270, DV_H = DV_SURF + DV_MAXM * DV_PXM + 24, DV_C = 8;
function dvLv(k) { if (!S.dv) S.dv = {}; let v = S.dv[k] || 0; if (k === 'o2' && S.upg && S.upg.oxygen) v = Math.max(v, 1); return v; }
function dvVal(k) { return DV_UP[k].vals[dvLv(k)]; }
function dvCap() { return dvVal('bag') + ((S.dv && S.dv.bonusKg) || 0); }
function dvDepth(y) { return Math.max(0, Math.round((y - DV_SURF) / DV_PXM)); }
function dvSolid(x, y) { if (x < 0 || x >= DV_W || y >= DV_H) return true; if (y < 0) return false; return !!DV.solid[Math.floor(y / DV_C) * DV.cols + Math.floor(x / DV_C)]; }
function dvFree(x, y, r = 4) { return !dvSolid(x - r, y) && !dvSolid(x + r, y) && !dvSolid(x, y - r) && !dvSolid(x, y + r); }

// ---------------- 生成海底地形 ----------------
function dvGenerate() {
  const cols = DV.cols = Math.ceil(DV_W / DV_C), rows = DV.rows = Math.ceil(DV_H / DV_C), sol = DV.solid = new Uint8Array(cols * rows);
  const seed = Math.random() * 1000;
  for (let r = 0; r < rows; r++) {
    const y = r * DV_C, deep = y > DV_SURF;
    // 两侧岩壁，越深越窄
    const wl = 2 + Math.round(2 + Math.sin(r * 0.21 + seed) * 2 + Math.sin(r * 0.07 + seed * 2) * 2 + (y / DV_H) * 3);
    const wr = 2 + Math.round(2 + Math.sin(r * 0.17 + seed * 3) * 2 + Math.sin(r * 0.05 + seed) * 2 + (y / DV_H) * 3);
    for (let c = 0; c < cols; c++) if (deep && (c < wl || c >= cols - wr)) sol[r * cols + c] = 1;
    if (y >= DV_H - 20) for (let c = 0; c < cols; c++) sol[r * cols + c] = 1;   // 海床
  }
  // 中间的礁石
  for (let k = 0; k < 16; k++) {
    const cx = 8 + Math.floor(Math.random() * (cols - 16)), cy = Math.floor((DV_SURF + 60 + Math.random() * (DV_H - DV_SURF - 120)) / DV_C);
    const rw = 2 + Math.floor(Math.random() * 4), rh = 1 + Math.floor(Math.random() * 3);
    for (let r = cy - rh; r <= cy + rh; r++) for (let c = cx - rw; c <= cx + rw; c++) if (r > 0 && r < rows && c > 0 && c < cols && ((c - cx) / rw) ** 2 + ((r - cy) / rh) ** 2 <= 1) sol[r * cols + c] = 1;
  }
  // 地形缓存图
  const g = DV.bg = mkCanvas(DV_W, DV_H), x = g.x;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (!sol[r * cols + c]) continue;
    const d = (r * DV_C - DV_SURF) / (DV_H - DV_SURF), top = r > 0 && !sol[(r - 1) * cols + c];
    x.fillStyle = d < 0.2 ? '#c28569' : d < 0.45 ? '#6e5a7a' : d < 0.7 ? '#3a4466' : '#262b44'; x.fillRect(c * DV_C, r * DV_C, DV_C, DV_C);
    x.fillStyle = 'rgba(0,0,0,0.18)'; if ((c + r) % 3 === 0) x.fillRect(c * DV_C + 2, r * DV_C + 3, 3, 2);
    if (top) { x.fillStyle = d < 0.2 ? '#e4a672' : d < 0.45 ? '#8b7aa0' : '#5a6988'; x.fillRect(c * DV_C, r * DV_C, DV_C, 2); }
  }
  // 水草、珊瑚装饰

    if (sol[r * cols + c] && !sol[(r - 1) * cols + c] && Math.random() < 0.18) DV.deco.push({ x: c * DV_C + 4, y: r * DV_C, k: r * DV_C < DV_SURF + 220 ? (Math.random() < 0.5 ? 'kelp' : 'coral') : 'kelp', h: 8 + Math.floor(Math.random() * 14), ph: Math.random() * 6 });
  }
}
function dvRandFree(d0, d1, nearWall) {
  for (let t = 0; t < 60; t++) {
    const y = DV_SURF + (d0 + Math.random() * (d1 - d0)) * DV_PXM, x = 20 + Math.random() * (DV_W - 40);

}
function dvSpawnLife() {

}

// ---------------- 下潜 / 上船 ----------------
function startDive() {
  UI.close();
  transition('潜入蓝洞', () => {
    dvGenerate(); dvSpawnLife();
    Object.assign(DV, { on: true, x: DV_W / 2 + 22, y: DV_SURF + 6, vx: 0, vy: 0, flip: false, o2: dvVal('o2'), o2max: dvVal('o2'), bag: [], kg: 0, harp: null, str: null, hurt: 0, cam: 0, camx: 0, warn: 0, maxDepth: 0, t: 0, bub: 0 });
    FISH_ST = null; clearQueue();

  });
}
function endDive(forced) {
  let kept = DV.bag;
  if (forced && kept.length) {
    // 氧气耗尽：只能带回一件最值钱的
    const best = kept.reduce((a, b) => (ITEMS[a.id].sell >= ITEMS[b.id].sell ? a : b));
    kept = [best];
  }
  const sum = {};
  for (const it of kept) { addItem(it.id, 1, it.q || 0); sum[it.id] = (sum[it.id] || 0) + 1; }
  const n = kept.length;
  if (n) { S.stats.dive = (S.stats.dive || 0) + n; addSkillXP('fish', n * 6); addXP(n * 3); emit('dive'); }
  DV.result = { forced, sum, lost: DV.bag.length - n, depth: DV.maxDepth };
  transition(forced ? '氧气耗尽……被救上了船' : '回到船上', () => { DV.on = false; DV.harp = null; DV.str = null; UI.open({ type: 'diveEnd' }); });
}

// ---------------- 每帧 ----------------
function updateDive2(dt) {
  if (!DV.on || RT.fadeT > 0) return;
  DV.t += dt;
  const depth = dvDepth(DV.y), lim = dvVal('depth');
  DV.maxDepth = Math.max(DV.maxDepth, depth);
  // 氧气：每秒 1；超过潜水服的极限深度时快 4 倍
  if (DV.y > DV_SURF + 2) DV.o2 -= dt * (depth > lim ? 4 : 1);
  else DV.o2 = Math.min(DV.o2max, DV.o2 + dt * 8);
  if (depth > lim) { DV.warn += dt; if (DV.warn > 1.2) { DV.warn = 0; sfx('tick'); } }
  if (DV.o2 <= 0) { DV.o2 = 0; endDive(true); return; }
  if (DV.hurt > 0) DV.hurt -= dt;
  // 游动：八方向 + 惯性
  if (!DV.str) {
    const sp = 62 * (DV.kg > dvCap() * 0.8 ? 0.8 : 1);
    const tx = joyActive() ? joy.dx * sp : 0, ty = joyActive() ? joy.dy * sp : 6;
    DV.vx += (tx - DV.vx) * Math.min(1, dt * 4); DV.vy += (ty - DV.vy) * Math.min(1, dt * 4);
    if (Math.abs(DV.vx) > 4) DV.flip = DV.vx < 0;
    const nx = DV.x + DV.vx * dt, ny = DV.y + DV.vy * dt;
    if (dvFree(nx, DV.y, 5)) DV.x = nx; else DV.vx = 0;
    if (dvFree(DV.x, ny, 5) && ny > DV_SURF - 2) DV.y = ny; else DV.vy = 0;
    DV.bub -= dt; if (DV.bub <= 0) { DV.bub = rnd(0.6, 1.3); DVFX.push({ x: DV.x + (DV.flip ? -6 : 6), y: DV.y - 6, vy: -22, t: 0, life: 1.6 }); }
  }
  // 海洋生物
  for (const f of DV.life) {
    const sp = f.sp; f.ph += dt;
    if (f.held || sp.beh === 'static') continue;
    const dx = DV.x - f.x, dy = DV.y - f.y, d = Math.hypot(dx, dy) || 1;
    let vx = f.vx, vy = 0;
    if (sp.beh === 'drift') { vx = Math.sin(f.ph * 0.5) * sp.sp; vy = Math.sin(f.ph * 1.3) * sp.sp; }
    else if (sp.beh === 'crawl') { f.t -= dt; if (f.t <= 0) { f.t = rnd(1, 3); f.vx = (Math.random() < 0.5 ? -1 : 1) * sp.sp; } vx = f.vx; vy = 20; }
    else {
      f.t -= dt; if (f.t <= 0) { f.t = rnd(1.5, 4); f.vx = (Math.random() < 0.5 ? -1 : 1) * sp.sp * rnd(0.4, 0.8); }
      vy = Math.sin(f.ph * 1.5) * 6;
      if (sp.flee && d < 48) { vx = -dx / d * sp.sp * 1.5; vy = -dy / d * sp.sp * 1.2; }
      if (sp.agg && d < 80 && f.bite <= 0) { vx = dx / d * sp.sp * 1.6; vy = dy / d * sp.sp * 1.6; }
    }
    if (f.bite > 0) { f.bite -= dt; vx = -dx / d * sp.sp; vy = -dy / d * sp.sp; }
    const nx = f.x + vx * dt, ny = f.y + vy * dt;
    if (dvFree(nx, f.y, 3) && dvDepth(f.y) >= 0) f.x = nx; else f.vx = -f.vx;
    if (dvFree(f.x, ny, 3) && ny > DV_SURF + 8) f.y = ny;
    if (Math.abs(vx) > 2) f.flip = vx < 0;
    // 攻击 / 蜇人
    const hitR = 6 + (sp.sc || 1) * 4;
    if (d < hitR && DV.hurt <= 0 && (sp.agg || sp.sting)) {
      const dmg = sp.agg || sp.sting; DV.o2 -= dmg; DV.hurt = 1.2; f.bite = 1.5;
      DVFX.push({ txt: '-' + dmg + ' 氧气', x: DV.x, y: DV.y - 14, t: 0, life: 1, col: '#f6757a' }); sfx('hurt');
      if (navigator.vibrate) try { navigator.vibrate(50); } catch (_) { }
    }
  }
  // 鱼叉
  const H = DV.harp;
  if (H) {
    if (!H.back) {
      H.x += H.vx * dt; H.y += H.vy * dt; H.life -= dt;
      for (const f of DV.life) {
        if (f.sp.beh === 'static' || f.held) continue;
        if (dist(f.x, f.y, H.x, H.y) < 6 + (f.sp.sc || 1) * 3) {
          H.back = true; H.got = f; f.held = true; sfx('hit');
          if ((f.sp.str || 0) > dvVal('harp')) { DV.str = { f, p: 0.35, t: 6, pull: 0.2 + (f.sp.str - dvVal('harp')) * 0.12 }; H.back = false; H.stuck = true; UI.tip('dv_struggle', '大鱼在挣扎！快速连续按黄色键把它拉回来'); }
          break;
        }
      }
      if (!H.stuck && (H.life <= 0 || dvSolid(H.x, H.y))) H.back = true;
    }
    if (H.stuck && DV.str) { H.x = DV.str.f.x; H.y = DV.str.f.y; }
    if (H.back) {
      const dx = DV.x - H.x, dy = DV.y - 4 - H.y, d = Math.hypot(dx, dy) || 1, st = 280 * dt;
      if (d < st + 5) { if (H.got) dvCatch(H.got); DV.harp = null; }
      else { H.x += dx / d * st; H.y += dy / d * st; if (H.got) { H.got.x = H.x; H.got.y = H.y; } }
    }
  }
  // 拉扯
  const T = DV.str;
  if (T) {
    T.t -= dt; T.p -= T.pull * dt;
    T.f.x += Math.sin(DV.t * 9) * 0.6;
    if (T.p >= 1) { DV.str = null; if (DV.harp) { DV.harp.stuck = false; DV.harp.back = true; } sfx('catch'); }
    else if (T.p <= 0 || T.t <= 0) { DV.str = null; T.f.held = false; T.f.bite = 1.2; if (DV.harp) { DV.harp.stuck = false; DV.harp.got = null; DV.harp.back = true; } UI.toast('鱼挣脱了！'); sfx('error'); }
  }
  // 补给
  for (let i = DV.items.length - 1; i >= 0; i--) {
    const it = DV.items[i];
    if (it.k === 'o2' && dist(it.x, it.y, DV.x, DV.y) < 12) { DV.items.splice(i, 1); DV.o2 = Math.min(DV.o2max, DV.o2 + 25); sfx('ding'); DVFX.push({ txt: '+25 氧气', x: it.x, y: it.y - 10, t: 0, life: 1, col: '#2ce8f5' }); }
  }
  // 特效
  for (let i = DVFX.length - 1; i >= 0; i--) { const p = DVFX[i]; p.t += dt; if (p.vy) p.y += p.vy * dt; else p.y -= 14 * dt; if (p.t > p.life) DVFX.splice(i, 1); }
  // 镜头
  DV.cam = clamp(Math.round(DV.y - 170), -40, DV_H - H_DV());
  DV.camx = clamp(Math.round(DV.x - W / 2), 0, DV_W - W);
}
function H_DV() { return H - 60; }
const DVFX = [];
function dvCatch(f) {
  const i = DV.life.indexOf(f); if (i >= 0) DV.life.splice(i, 1);
  if (DV.kg + f.sp.kg > dvCap()) { UI.toast('网兜太重了，装不下了！\n回船上卸货，或者升级网兜'); sfx('error'); return; }
  const q = Math.random() < 0.1 + skillLv('fish') * 0.03 ? 1 : 0;
  DV.bag.push({ id: f.sp.id, q }); DV.kg = Math.round((DV.kg + f.sp.kg) * 10) / 10;
  DVFX.push({ txt: '+1 ' + ITEMS[f.sp.id].name, x: DV.x, y: DV.y - 16, t: 0, life: 1.2, col: '#ffffff' });
  sfx('pop');
  if (f.sp.id === 'clam' && Math.random() < 0.25) { DV.bag.push({ id: 'pearl', q: 0 }); DVFX.push({ txt: '珍珠！', x: DV.x, y: DV.y - 26, t: 0, life: 1.2, col: '#fee761' }); sfx('gem'); }
}
// 黄色键：附近有可以捡的东西就捡，否则发射鱼叉
function dvNearPick() {
  let best = null, bd = 16;
  for (const f of DV.life) if (f.sp.beh === 'static') { const d = dist(f.x, f.y, DV.x, DV.y); if (d < bd) { bd = d; best = { f }; } }
  for (const it of DV.items) if (it.k === 'crate') { const d = dist(it.x, it.y, DV.x, DV.y); if (d < bd + 4) { bd = d; best = { crate: it }; } }
  return best;
}
function dvAction() {
  if (DV.str) { DV.str.p += 0.11 + dvVal('harp') * 0.015; sfx('reel', { vol: 0.4 }); return; }
  const p = dvNearPick();
  if (p && p.f) { dvCatch(p.f); return; }
  if (p && p.crate) {
    DV.items.splice(DV.items.indexOf(p.crate), 1);
    const loot = weighted([['coal', 6], ['bar_iron', 4], ['battery', 5], ['gem', 2], ['pearl', 2], ['coins', 6]]);
    if (loot === 'coins') { const c = 100 + Math.floor(Math.random() * 200); addCoins(c); DVFX.push({ txt: '+' + c + ' 金币', x: DV.x, y: DV.y - 16, t: 0, life: 1.2, col: '#fee761' }); }
    else { const n = loot === 'gem' || loot === 'pearl' ? 1 : 2; for (let k = 0; k < n; k++) DV.bag.push({ id: loot, q: 0 }); DVFX.push({ txt: '补给箱：' + ITEMS[loot].name + '×' + n, x: DV.x, y: DV.y - 16, t: 0, life: 1.4, col: '#fee761' }); }
    sfx('levelup'); return;
  }
  if (DV.harp) return;
  // 前方锥形范围内自动瞄准
  const fx = DV.flip ? -1 : 1, R = 90 + dvLv('harp') * 15;
  let best = null, bd = R;
  for (const f of DV.life) {
    if (f.sp.beh === 'static') continue;
    const dx = f.x - DV.x, dy = f.y - DV.y, d = Math.hypot(dx, dy);
    if (d < bd && dx * fx > 0 && Math.abs(dy) < Math.abs(dx) * 1.2 + 10) { bd = d; best = f; }
  }
  let ax = fx, ay = 0;
  if (best) { const d = Math.hypot(best.x - DV.x, best.y - DV.y) || 1; ax = (best.x + (best.vx || 0) * 0.15 - DV.x) / d; ay = (best.y - DV.y) / d; }
  else if (joyActive()) { ax = joy.dx || fx; ay = joy.dy; const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l; }
  DV.harp = { x: DV.x + fx * 10, y: DV.y - 2, vx: ax * 260, vy: ay * 260, life: R / 260, back: false, got: null };
  sfx('shoot');
}
function dvPlanFront() {
  if (DV.str) return { icon: ICON.t_harpoon, run: dvAction, rep: false };
  const p = dvNearPick();
  if (p) return { icon: p.crate ? ICON.crate : ICON[p.f.sp.id], run: dvAction, rep: false };
  return { icon: ICON.t_harpoon, run: DV.harp ? null : dvAction, rep: true };

function dvPlanFacility() {

}

// ---------------- 绘制 ----------------
function drawDiveScene() {

  const colAt = d => { for (let i = 1; i < KEYS.length; i++) if (d <= KEYS[i][0]) { const [a, ca] = KEYS[i - 1], [b, cb] = KEYS[i], k = (d - a) / (b - a); return ca.map((v, j) => Math.round(v + (cb[j] - v) * k)); } return KEYS[KEYS.length - 1][1]; };
  for (let y = 0; y < H; y += 4) {

  }

  // 生物

    if (f.sp.beh === 'static') { dsprScaled(ic, sx, sy - 3, 1); if (dist(f.x, f.y, DV.x, DV.y) < 16) { ctx.fillStyle = '#fee761'; ctx.fillRect(sx - 1, sy - 12, 3, 3); } continue; }
    const t = f.flip ? flipped(ic) : ic, w = t.c.width * sc, h = t.c.height * sc;

function sushiStart(sel) {
  const st = sushiSt(); st.day = S.day;
  const menu = sel.map(id => ({ id, left: cnt(id) }));
  return { menu, t: 0, dur: 80, seats: [null, null, null, null], spawn: 1, income: 0, served: 0, angry: 0, tips: 0, done: false, msg: [] };
}
const SUSHI_GUESTS = () => SPR.villagers.concat(SPR.tourists);
function sushiUpdate(R, dt) {
  if (R.done) return;
  R.t += dt;
  const st = sushiSt(), any = R.menu.some(d => d.left > 0);
  // 来客
  R.spawn -= dt;
  if (R.t < R.dur && any && R.spawn <= 0) {
    R.spawn = Math.max(1.6, rnd(3, 5.5) - st.fame * 0.02);
    const k = R.seats.findIndex(s => !s);
    if (k >= 0) {
      const opts = R.menu.filter(d => d.left > 0);
      const want = Math.random() < 0.18 ? 'tea' : pick(opts).id;
      const pat = 14 + Math.min(6, st.fame * 0.05);
      R.seats[k] = { want, pat, max: pat, spr: Math.floor(Math.random() * SUSHI_GUESTS().length), in: 0, happy: 0 };
      sfx('ding');
    }
  }
  for (let k = 0; k < 4; k++) {
    const g = R.seats[k]; if (!g) continue;
    g.in = Math.min(1, g.in + dt * 3);
    if (g.happy > 0) { g.happy -= dt; if (g.happy <= 0) R.seats[k] = null; continue; }
    g.pat -= dt;
    if (g.pat <= 0) { R.seats[k] = null; R.angry++; R.msg.push({ s: '客人等太久生气走了', t: 0 }); sfx('error'); }
  }
  for (const m of R.msg) m.t += dt; R.msg = R.msg.filter(m => m.t < 1.6);
  const nobody = R.seats.every(s => !s);
  if ((R.t >= R.dur || !any) && nobody) sushiFinish(R);
}
function sushiServe(R, id) {
  const k = R.seats.reduce((b, g, i) => g && !g.happy && g.want === id && (b < 0 || g.pat < R.seats[b].pat) ? i : b, -1);
  if (k < 0) { R.msg.push({ s: '没有客人点这个哦', t: 0 }); sfx('error'); return; }
  const g = R.seats[k];
  if (id === 'tea') { const tip = 5 + Math.round(g.pat / g.max * 15); R.income += tip; R.tips += tip; addCoins(tip); g.happy = 0.7; sfx('pop'); R.msg.push({ s: '续茶 +' + tip, t: 0 }); return; }
  const d = R.menu.find(x => x.id === id); if (!d || d.left <= 0 || cnt(id) <= 0) { R.msg.push({ s: '这道菜卖完了', t: 0 }); sfx('error'); return; }
  const q = qCount(id, 2) ? 2 : qCount(id, 1) ? 1 : 0;
  removeBest(id); d.left--;
  const base = sushiPrice(id, q), tip = Math.round(base * 0.3 * (g.pat / g.max));
  R.income += base + tip; R.tips += tip; R.served++; addCoins(base + tip);
  g.happy = 0.8; sfx('coin');
  R.msg.push({ s: sushiName(id) + ' +' + (base + tip), t: 0 });
}
function sushiFinish(R) {
  R.done = true;
  const st = sushiSt();
  const gain = R.served * 2 - R.angry * 3;
  st.fame = Math.max(0, st.fame + gain); st.served += R.served; st.total += R.income;

}

function drawHelp() {

// ---------------- 钓鱼小游戏 ----------------
function drawFishGame() {
  const F = FISH_ST; if (!F || F.phase !== 'game') return;
  const M = F.mg, bx = W - 52, by = 70, bh = 200, bw = 22;
  hit('fishgame', 0, 0, W, DECK_Y, null);
  ctx.fillStyle = 'rgba(24,20,37,0.3)'; ctx.fillRect(0, 0, W, DECK_Y);
  drawPanel(bx - 10, by - 14, bw + 34, bh + 28);
  // 水柱
  ctx.fillStyle = PAL.K; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
  ctx.fillStyle = '#124e89'; ctx.fillRect(bx, by, bw, bh);
  for (let k = 0; k < 8; k++) { ctx.fillStyle = '#1b6aa8'; ctx.fillRect(bx + 2 + (k * 7) % 16, by + ((gameT * 20 + k * 31) % bh), 2, 3); }
  // 捕获框（y 越大越靠上）
  const zy = by + bh - (M.barY + M.barH) * bh, zh = M.barH * bh;
  ctx.fillStyle = M.inside ? '#a8e04e' : '#63c74d'; ctx.globalAlpha = 0.75; ctx.fillRect(bx + 1, Math.round(zy), bw - 2, Math.round(zh)); ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(bx + 1, Math.round(zy), bw - 2, 1); ctx.fillRect(bx + 1, Math.round(zy + zh) - 1, bw - 2, 1);
  // 宝箱
  if (M.chest && !M.chest.got) { const cy = by + bh - M.chest.y * bh; dsprScaled(ICON.u_chest, bx + bw / 2, cy, 1); ctx.fillStyle = PAL.K; ctx.fillRect(bx - 7, cy - 6, 4, 12); ctx.fillStyle = '#fee761'; ctx.fillRect(bx - 6, cy + 5 - Math.round(10 * M.chest.p), 2, Math.round(10 * M.chest.p)); }
  // 鱼
  const fy = by + bh - M.fishY * bh;
  dsprScaled(ICON[M.fish.id], bx + bw / 2 + Math.sin(gameT * 12) * 1.5, fy, 1);
  // 进度条
  const px = bx + bw + 5;
  ctx.fillStyle = PAL.K; ctx.fillRect(px, by - 1, 7, bh + 2);
  ctx.fillStyle = '#3a4466'; ctx.fillRect(px + 1, by, 5, bh);
  const ph = Math.round(bh * M.prog);
  ctx.fillStyle = M.prog > 0.66 ? '#63c74d' : M.prog > 0.33 ? '#feae34' : '#e43b44'; ctx.fillRect(px + 1, by + bh - ph, 5, ph);
  drawText('按住 A 键', 60, by + 10, { size: 8, color: '#ffffff', outline: PAL.K, align: 0.5 });
  drawText('让绿框上升', 60, by + 24, { size: 7, color: '#ffffff', outline: PAL.K, align: 0.5 });
  drawText('松开会下降', 60, by + 36, { size: 7, color: '#ffffff', outline: PAL.K, align: 0.5 });
  drawText('跟住鱼儿！', 60, by + 52, { size: 8, color: '#fee761', outline: PAL.K, align: 0.5 });
  drawText(ITEMS[M.fish.id].name + ' · ' + (BEH_NAME[M.beh] || '普通'), 60, by + 74, { size: 6.5, color: '#ffffff', outline: PAL.K, align: 0.5 });
  drawText('难度 ' + '★'.repeat(Math.max(1, Math.round(M.diff * 5))), 60, by + 86, { size: 6.5, color: '#feae34', outline: PAL.K, align: 0.5 });
  if (M.perfect) drawText('完美中…', 60, by + 100, { size: 6.5, color: '#a8e04e', outline: PAL.K, align: 0.5 });
  if (M.chest) drawText(M.chest.got ? '宝箱到手！' : '罩住宝箱可以拿到宝物', 60, by + 112, { size: 6, color: '#fee761', outline: PAL.K, align: 0.5 });

// ---------------- 弹窗 / 提示 ----------------
function drawOverlays(dt) {
  // 飞行物品
  const bagX = W - 76 + 2 * 25 + 11, bagY = 39, coinX = 32, coinY = 19;
  for (const f of FX.flyers) {
    if (f.t < 0) continue;
    const k = easeOut(clamp(f.t / f.life, 0, 1));
    const tx = f.target === 'coin' ? coinX : bagX, ty = f.target === 'coin' ? coinY : bagY;
    const x = lerp(f.sx, tx, k), y = lerp(f.sy, ty, k) - Math.sin(k * Math.PI) * f.up;
    dsprScaled(f.icon, x, y, 1 - k * 0.3);
  }
  for (const f of UI_FLOATS) { f.t += dt; drawText(f.s, f.x, f.y - f.t * 20, { size: 8, color: '#fee761', outline: PAL.K, align: 0.5, alpha: 1 - f.t }); }
  for (let k = UI_FLOATS.length - 1; k >= 0; k--) if (UI_FLOATS[k].t > 1) UI_FLOATS.splice(k, 1);
  // 任务完成横幅
  if (UI.banners.length) {
    const b = UI.banners[0]; b.t += dt;
    const inT = Math.min(1, b.t / 0.3), outT = b.t > 2.6 ? (b.t - 2.6) / 0.3 : 0;
    const y = Math.round(lerp(-40, 48, easeOutBack(inT)) - outT * 90);
    drawPanel(14, y, W - 28, 36, 1);
    ctx.fillStyle = '#feae34'; ctx.fillRect(18, y + 4, W - 36, 10);
    drawText('任务完成！', W / 2, y + 9, { size: 7.5, color: '#733e39', align: 0.5 });
    drawText(b.text, W / 2, y + 20, { size: 6.5, color: '#3e2731', align: 0.5 });
    let rx = W / 2 - 20;
    if (b.r.coins) { coinLabel(W / 2 - (b.r.xp ? 20 : 0), y + 29, b.r.coins, '#733e39', 6.5, 0.5); }
    if (b.r.xp) { dsprScaled(ICON.star, W / 2 + (b.r.coins ? 14 : -6), y + 29, 0.7); drawText('+' + b.r.xp, W / 2 + (b.r.coins ? 19 : -1), y + 29, { size: 6.5, color: '#124e89' }); }
    if (b.t > 2.9) UI.banners.shift();
  }
  // 吐司
  // 多条提示从下往上依次叠放，按各自高度累加，不会互相遮挡
  { let yb = TB_Y - 30;
    for (let k = UI.toasts.length - 1; k >= 0; k--) {
      const t = UI.toasts[k];
      t.t += dt / UI.toasts.length;
      const a = t.t < 0.15 ? t.t / 0.15 : t.t > 2.2 ? 1 - (t.t - 2.2) / 0.3 : 1;
      const lines = wrapText(t.s, 180, 7);
      const w = Math.max(...lines.map(l => textW(l, 7))) + 16, h = lines.length * 10 + 8;
      const y = yb - h; yb = y - 3;
      ctx.globalAlpha = a * 0.88; ctx.fillStyle = PAL.K; ctx.fillRect(Math.round(W / 2 - w / 2), y, w, h); ctx.globalAlpha = 1;
      ctx.globalAlpha = a; ctx.fillStyle = '#feae34'; ctx.fillRect(Math.round(W / 2 - w / 2), y, 2, h); ctx.globalAlpha = 1;
      lines.forEach((l, q) => drawText(l, W / 2 + 1, y + 9 + q * 10, { size: 7, color: '#ffffff', align: 0.5, alpha: a }));
    } }
  UI.toasts = UI.toasts.filter(t => t.t < 2.5);
  // 大弹窗
  const p = UI.popup;
  if (p) {
    p.t += dt;
    const k = easeOutBack(Math.min(1, p.t / 0.35));
    ctx.fillStyle = `rgba(24,20,37,${0.6 * Math.min(1, p.t * 4)})`; ctx.fillRect(0, 0, W, H);
    hit('popup', 0, 0, W, H, () => { if (p.t > 0.5) { UI.popup = null; sfx('close'); } });
    ctx.save(); ctx.translate(W / 2, DECK_Y / 2); ctx.scale(k, k); ctx.translate(-W / 2, -(DECK_Y / 2));
    if (p.kind === 'level') {
      const ph = 132 + Math.ceil(p.unlocks.length / 3) * 40, y = Math.round(DECK_Y / 2 + 4 - ph / 2);
      // 光芒
      ctx.save(); ctx.translate(W / 2, y + 30); ctx.rotate(gameT * 0.5); ctx.fillStyle = 'rgba(254,231,97,0.18)';
      for (let r = 0; r < 12; r++) { ctx.rotate(Math.PI / 6); ctx.fillRect(-4, 0, 8, 120); } ctx.restore();
      drawPanel(16, y, W - 32, ph);
      ribbon(W / 2, y - 8, '升级啦！');
      dsprScaled(ICON.star, W / 2, y + 34, 3.2 + Math.sin(gameT * 4) * 0.2);
      drawText(String(p.lv), W / 2, y + 36, { size: 10, color: '#733e39', align: 0.5 });
      drawText(`等级 ${p.lv}`, W / 2, y + 62, { size: 9, color: '#3e2731', align: 0.5 });
      coinLabel(W / 2, y + 76, p.bonus, '#733e39', 7.5, 0.5);
      if (p.unlocks.length) {
        drawText('新解锁', W / 2, y + 92, { size: 7, color: '#8a5a3b', align: 0.5 });
        p.unlocks.forEach((u, j) => {
          const cx = W / 2 + ((j % 3) - (Math.min(3, p.unlocks.length - Math.floor(j / 3) * 3) - 1) / 2) * 52, cy = y + 112 + Math.floor(j / 3) * 40;
          drawInset(cx - 14, cy - 12, 28, 24, '#fff6d3');
          const ic = u.place ? itemIcon(u.icon) : (ICON[u.icon] || itemIcon(u.icon));
          if (ic) dsprScaled(ic, cx, cy, ic.h > 16 ? 0.9 : 1.3);
          drawText(u.name, cx, cy + 18, { size: 5.5, color: '#3e2731', align: 0.5 });
        });
      }
      drawText('按 A 继续', W / 2, y + ph - 10, { size: 6, color: '#b86f50', align: 0.5, alpha: 0.6 + Math.sin(gameT * 4) * 0.4 });
    } else if (p.kind === 'fish') {
      const y = DECK_Y / 2 - 50;
      drawPanel(40, y, W - 80, 104);
      ribbon(W / 2, y - 8, p.perfect ? '完美！' : '钓到啦！');
      dsprScaled(ICON[p.id], W / 2, y + 42, 4);
      drawText(ITEMS[p.id].name + (p.q ? (p.q === 2 ? ' ★金星' : ' ☆银星') : ''), W / 2, y + 74, { size: 9, color: p.q === 2 ? '#be4a2f' : '#3e2731', align: 0.5 });
      coinLabel(W / 2, y + 88, Math.round(ITEMS[p.id].sell * QUAL_MUL[p.q || 0]), '#8a5a3b', 6.5, 0.5);
      if (p.t > 2.2) UI.popup = null;
    }
    ctx.restore();
  }
}

}

  const a = f.phase === 'out' ? f.t / 0.9 : f.phase === 'hold' ? 1 : 1 - f.t / 0.8;

function uiHitAt(x, y) {
  for (let k = UI.hits.length - 1; k >= 0; k--) {
    const h = UI.hits[k];
    if (h.clip && !(x >= h.clip.x && x < h.clip.x + h.clip.w && y >= h.clip.y && y < h.clip.y + h.clip.h)) continue;
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) return h;
  }
  return null;
}
let downTarget = null;
input.handlers = {
  down(x, y) {
    const h = uiHitAt(x, y);
    UI.sdrag = null;
    if (h) {
      downTarget = 'ui'; UI.pressed = h.id;
      if (h.onDown && h.fn) { h.fn(); h.fired = true; UI.firedId = h.id; }
      // 查找该位置所在的滚动区
      for (let k = UI.hits.length - 1; k >= 0; k--) { const s = UI.hits[k]; if (s.scroll && x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) { UI.sdrag = { key: s.scroll.key, maxS: s.scroll.maxS, y0: y, s0: UI.scroll[s.scroll.key] || 0, active: false }; break; } }
      return;
    }
    if (UI.seedPicker) { UI.seedPicker = false; downTarget = 'none'; return; }
    downTarget = 'world';
  },
  move(x, y) {
    if (downTarget === 'ui' && UI.sdrag) {
      const d = y - UI.sdrag.y0;
      if (Math.abs(d) > 4) UI.sdrag.active = true;
      if (UI.sdrag.active) { UI.scroll[UI.sdrag.key] = clamp(UI.sdrag.s0 - d, 0, UI.sdrag.maxS); UI.pressed = null; }
      return;
    }

  },
  up(x, y, cancel) {
    if (downTarget === 'ui') {
      const h = uiHitAt(x, y);
      if (!cancel && h && h.id === UI.pressed && h.fn && !h.onDown && UI.firedId !== h.id && !(UI.sdrag && UI.sdrag.active)) h.fn();
      const ph = UI.hits.find(q => q.id === UI.pressed);
      if (ph && ph.onUp) ph.onUp();
      UI.firedId = null;
      UI.pressed = null; UI.sdrag = null;
    } else if (downTarget === 'world') {
      // 建筑点击即可打开；田地、动物、村民、植物需要走到旁边按按钮
      if (!cancel && !UI.title) { UI.tip('hint_tap', '场景不能直接点击\n动物、村民、种地：按黄色键\n房屋、饲料槽等设施：按蓝色键'); }
    }
    downTarget = null;
  }
};

  UI.open({
    type: 'confirm', title: '欢迎来到田园', noCancel: true, yesLabel: '开始吧！', col: 'green',
    text: '爷爷把这座小农场交给了你！\n开垦土地、种下种子、养些小动物，\n把这里经营成最美的田园吧。\n\n方向键移动，站在目标旁边按键：\n黄色键：动物、村民、种地浇水收获\n蓝色键：房屋、饲料槽、水井、商店等设施\n身边没东西时长按按键打开菜单。\n先跟着左上角的任务一步步来～',
    yes: () => UI.close()
  });
}

// ---------------- 标题画面 ----------------
const TITLE = { t: 0, hasSave: false };
function drawTitle(dt) {
  TITLE.t += dt;
  // 背景：缓慢平移的农场
  CAM.x = 120 + Math.sin(TITLE.t * 0.08) * 100; CAM.y = 60 + Math.sin(TITLE.t * 0.05) * 30;
  CAM.x = clamp(CAM.x, 0, MW * TS - W); CAM.y = clamp(CAM.y, 0, MH * TS - H);
  drawWorld(dt); drawWeather(dt);
  ctx.fillStyle = 'rgba(24,20,37,0.3)'; ctx.fillRect(0, 0, W, H);
  // 标志：木牌
  const ly = 64 + Math.round(Math.sin(TITLE.t * 2) * 2);
  ctx.fillStyle = '#5b3a29'; ctx.fillRect(40, ly + 30, 4, 22); ctx.fillRect(W - 44, ly + 30, 4, 22);
  drawPanel(14, ly - 34, W - 28, 66, 1);
  ctx.fillStyle = '#8a5a3b'; ctx.fillRect(18, ly - 30, W - 36, 57);
  for (let yy = ly - 26; yy < ly + 26; yy += 7) { ctx.fillStyle = '#7a4d33'; ctx.fillRect(18, yy, W - 36, 1); }
  ctx.fillStyle = '#b07a52'; ctx.fillRect(18, ly - 30, W - 36, 1);
  drawText('像素田园物语', W / 2, ly - 7, { size: 18, color: '#fee761', outline: '#3e2731', shadow: '#3e2731', align: 0.5 });
  drawText('PIXEL  FARM  STORY', W / 2, ly + 17, { size: 7, color: '#ead4aa', outline: '#3e2731', align: 0.5 });
  // 闪光
  for (let k = 0; k < 4; k++) { const a = TITLE.t * 1.3 + k * 1.7, px = 30 + ((a * 37) % (W - 60)), py = ly - 24 + ((k * 23) % 40); const tw = (Math.sin(TITLE.t * 5 + k * 2) + 1) / 2; if (tw > 0.6) { ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(px), Math.round(py) - 1, 1, 3); ctx.fillRect(Math.round(px) - 1, Math.round(py), 3, 1); } }
  // 角色
  const gy = 150;
  ctx.fillStyle = 'rgba(24,20,37,0.35)'; ctx.fillRect(30, gy + 2, W - 60, 3);
  const bob = k => Math.round(Math.abs(Math.sin(TITLE.t * 3 + k)) * -3);
  dsprBC(SPR.chicken[Math.floor(TITLE.t * 4) % 2], 44, gy + bob(0));
  dsprBC(SPR.cow[0], 76, gy + bob(1));
  dsprBC(SPR.far.cheer, W / 2, gy + bob(2));
  dsprBC(SPR.sheep[0], 140, gy + bob(3), true);
  dsprBC(SPR.dog[Math.floor(TITLE.t * 5) % 2], 172, gy + bob(4), true);
  ['turnip', 'carrot', 'tomato', 'strawberry', 'pumpkin', 'corn', 'watermelon'].forEach((k, j) => {
    const a = TITLE.t * 0.7 + j * 0.9;
    dsprScaled(ICON[k], W / 2 + Math.cos(a) * 92, 176 + Math.sin(a) * 10, 1);
  });
  // 按钮（触屏点击或摇杆 + A 键）
  const B = (id, y, label, col, fn) => {
    const x = 48, w = W - 96, h = 26, pr = hit(id, x, y, w, h, () => { sfx('select'); fn(); });
    drawBtn(x, y, w, h, col, pr); drawText(label, W / 2, y + 12 + (pr ? 1 : 0), { size: 9, color: '#ffffff', outline: BTN_C[col][0], align: 0.5 });
  };
  const SB = (id, y, label, fn) => { const x = 66, w = W - 132, h = 18, pr = hit(id, x, y, w, h, () => { sfx('select'); fn(); }); drawBtn(x, y, w, h, 'blue', pr); drawText(label, W / 2, y + 8 + (pr ? 1 : 0), { size: 7, color: '#ffffff', outline: BTN_C.blue[0], align: 0.5 }); };
  if (TITLE.hasSave) {
    B('title_main', 180, '继续游戏', 'green', () => startGame(false));
    B('title_new', 211, TITLE.confirmNew ? '再按一次清除存档' : '新的开始', TITLE.confirmNew ? 'red' : 'yellow', () => { if (TITLE.confirmNew) startGame(true); else { TITLE.confirmNew = true; } });
    SB('title_import', 243, '导入存档', () => saveTransfer('import'));
  } else { B('title_main', 204, '开始游戏', 'green', () => startGame(true)); SB('title_import', 238, '导入存档', () => saveTransfer('import')); }
  drawText('方向键选择 · 黄色键确认 · 自动存档', W / 2, DECK_Y - 10, { size: 6, color: '#c0cbdc', outline: PAL.K, align: 0.5 });
  drawText('v3.0 测试版', W - 6, DECK_Y - 10, { size: 5, color: '#8b9bb4', align: 1 });
}
// ---------------- 存档导出 / 导入（换设备、从浏览器搬到桌面图标） ----------------
function exportCode() {
  if (S && !UI.title) saveGame();
  const raw = Store.get(SAVE_KEY); if (!raw) return '';
  return 'PFS1:' + btoa(unescape(encodeURIComponent(raw)));
}
function decodeCode(code) {
  code = (code || '').replace(/\s+/g, '');
  const i = code.indexOf('PFS1:'); if (i < 0) return null;
  try { const d = JSON.parse(decodeURIComponent(escape(atob(code.slice(i + 5))))); return d && d.ground && d.coins !== undefined ? d : null; } catch (_) { return null; }
}
function saveTransfer(mode) {
  if (document.getElementById('pfs')) return;
  const ov = document.createElement('div'); ov.id = 'pfs';
  ov.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(14,12,26,.82);display:flex;align-items:center;justify-content:center;font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;';
  const box = document.createElement('div');
  box.style.cssText = 'width:min(88vw,360px);background:#f4e6c4;border:3px solid #3e2731;border-radius:6px;padding:14px;color:#3e2731;box-shadow:0 8px 30px rgba(0,0,0,.5)';
  const exp = mode === 'export', code = exp ? exportCode() : '';
  box.innerHTML = `<div style="font-weight:bold;font-size:17px;margin-bottom:6px">${exp ? '导出存档' : '导入存档'}</div>
    <div style="font-size:13px;color:#733e39;margin-bottom:8px">${exp ? '点“复制”，把这串文字粘贴到备忘录保存。到桌面图标版（或另一台手机）的“导入存档”里粘贴，就能恢复进度。' : '把之前导出的存档文字粘贴到下面，点“导入”。当前设备上的进度会被替换。'}</div>
    <textarea id="pfs_t" style="width:100%;box-sizing:border-box;height:120px;font:11px monospace;border:2px solid #8a5a3b;border-radius:4px;padding:6px;background:#fff6d3;color:#3e2731;-webkit-user-select:text;user-select:text;touch-action:auto" ${exp ? 'readonly' : 'placeholder="在这里长按 → 粘贴"'}></textarea>
    <div id="pfs_msg" style="font-size:13px;min-height:18px;margin:6px 0;color:#3e8948"></div>
    <div style="display:flex;gap:8px">
      <button id="pfs_ok" style="flex:1;padding:10px;font-size:15px;border:2px solid #265c42;background:#63c74d;color:#fff;border-radius:5px;font-weight:bold">${exp ? '复制' : '导入'}</button>
      <button id="pfs_x" style="flex:1;padding:10px;font-size:15px;border:2px solid #5e1a24;background:#e43b44;color:#fff;border-radius:5px;font-weight:bold">关闭</button>
    </div>`;
  ov.appendChild(box); document.body.appendChild(ov);
  const ta = document.getElementById('pfs_t'), msg = document.getElementById('pfs_msg');
  const close = () => { ov.remove(); };
  if (exp) { ta.value = code || ''; if (!code) { msg.style.color = '#a22633'; msg.textContent = '还没有存档'; } }
  document.getElementById('pfs_x').onclick = close;
  document.getElementById('pfs_ok').onclick = async () => {
    if (exp) {
      let ok = false;
      try { await navigator.clipboard.writeText(code); ok = true; } catch (_) { }
      if (!ok) { try { ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); ok = document.execCommand('copy'); ta.setAttribute('readonly', ''); } catch (_) { } }
      msg.style.color = ok ? '#3e8948' : '#a22633';
      msg.textContent = ok ? '已复制！去备忘录里粘贴保存吧' : '复制失败，请长按上面的文字手动全选复制';
      return;
    }
    const d = decodeCode(ta.value);
    if (!d) { msg.style.color = '#a22633'; msg.textContent = '存档文字不完整或不正确，请重新粘贴'; return; }
    Store.set(SAVE_KEY, JSON.stringify(d));
    msg.style.color = '#3e8948'; msg.textContent = '导入成功！正在重新载入…';
    setTimeout(() => location.reload(), 600);
  };
}
function startGame(fresh) {
  Audio_.unlock();
  if (fresh) { Store.del(SAVE_KEY); S = newState(); }
  initWorld();
  UI.title = false;
  if (fresh) showIntro();
  else UI.toast(`欢迎回来！今天是${SEASONS[curSeason()]}季第${dayOfSeason()}天`);
}

// ---------------- 主循环 ----------------
let lastT = performance.now(), saveT = 0;
const FADE_OUT = 0.4, FADE_HOLD = 0.85, FADE_END = 1.25;
function update(dt) {
  const paused = !!(UI.modal || UI.popup || UI.fade || RT.fadeT > 0);
  if (RT.fadeT > 0) { const f0 = RT.fadeT; RT.fadeT += dt; if (f0 < FADE_OUT && RT.fadeT >= FADE_OUT && RT.fadeTo) { const fn = RT.fadeTo; RT.fadeTo = null; fn(); } if (RT.fadeT > FADE_END) RT.fadeT = 0; }
  if (FX.flash > 0) FX.flash -= dt;
  if (!paused) {
    const dm = dt * MIN_PER_SEC * timeScale;
    S.time += dm;
    advanceTime(dm);
    updateAnimals(dt, dm);
    if (DV.on) updateDive2(dt); else updatePlayer(dt);
    updateFishing(dt);
    updateBombs(dt);
    updateDive(dt);
    updateNPCs(dt);
    updateVisitors(dt);
    updateCombat(dt);
    if (S.time >= 24 * 60 && !RT.lateWarn) { RT.lateWarn = true; UI.toast('已经半夜 12 点了，凌晨 2 点前不回家睡觉会累倒的！'); }
    if (S.time >= DAY_END) startSleep(true);
  } else updateAnimals(dt, 0);
  updateDog(dt);
  updateFx(dt);
  updateCamera(dt);
  if (binOpenT > 0 && !(UI.modal && UI.modal.type === 'bag' && UI.bagSell)) binOpenT -= dt;
  saveT += dt; if (saveT > 15) { saveT = 0; saveGame(); }
}
function render(dt) {
  if (DV.on) { drawDiveScene(); drawDiveHUD(); }
  else { drawWorld(dt); drawWeather(dt); drawLighting(); drawHUD(dt); }
  drawFishGame();
  drawModal(dt);
  drawOverlays(dt);
  drawDeck(dt);
  buildNav(); navStep(dt);
  drawFocus(dt);
  drawFade(dt);
  if (RT.fadeT > 0) {
    const t = RT.fadeT, a = t < FADE_OUT ? t / FADE_OUT : t < FADE_HOLD ? 1 : 1 - (t - FADE_HOLD) / (FADE_END - FADE_HOLD);
    hit('fade2', 0, 0, W, H, null); ctx.fillStyle = `rgba(14,12,26,${clamp(a, 0, 1)})`; ctx.fillRect(0, 0, W, H);
    if (RT.fadeLabel && a > 0.5) drawText(RT.fadeLabel, W / 2, H / 2 - 20, { size: 10, color: '#fee761', outline: PAL.K, align: 0.5, alpha: clamp((a - 0.5) * 2, 0, 1) });
  }
}
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.05);
  gameT += dt;
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  UI.hits = [];
  try {
    if (UI.title) { drawTitle(dt); drawDeck(dt); buildNav(); navStep(dt); drawFocus(dt); }
    else { update(dt); render(dt); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
addEventListener('pagehide', () => saveGame());

// ---------------- 原生壳 / PWA 钩子 ----------------
window.__appPause = () => { try { saveGame(); if (Audio_.ctx) Audio_.ctx.suspend(); joy.id = null; joy.mag = 0; } catch (_) { } };
window.__appResume = () => { try { if (Audio_.ctx && !UI.title) Audio_.ctx.resume(); } catch (_) { } };
if (window.__PWA__ && 'serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (_) { }
}

// ---------------- 启动 ----------------
(function boot() {
  const saved = loadGame();
  TITLE.hasSave = !!saved;
  S = saved || newState();
  initWorld();
  requestAnimationFrame(frame);
})();

</script>
