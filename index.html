'use strict';
// ============================================================
//  像素田园物语 · Pixel Farm Story
//  核心：画布、缩放、输入、工具函数、像素文字
// ============================================================
const W = 216, H = 384, RS = 2, TS = 16;
const cv = document.getElementById('game');
cv.width = W * RS; cv.height = H * RS;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  const s = Math.min(vw / W, vh / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fitCanvas);
if (window.visualViewport) visualViewport.addEventListener('resize', fitCanvas);
fitCanvas();

// ---------- 工具函数 ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function hash2(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mkCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; c.x = x; return c;
}
function fmtNum(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e5) return (n / 1e3).toFixed(0) + 'K';
  return String(n);
}

// ---------- 调色板 (Endesga 32) ----------
const PAL = {
  k: '#181425', K: '#3e2731', w: '#ffffff', W: '#c0cbdc', g: '#8b9bb4', G: '#5a6988',
  n: '#3a4466', N: '#262b44', r: '#e43b44', R: '#a22633', o: '#f77622', O: '#be4a2f',
  y: '#fee761', Y: '#feae34', l: '#63c74d', L: '#3e8948', d: '#265c42', D: '#193c3e',
  b: '#0099db', B: '#124e89', c: '#2ce8f5', s: '#e8b796', S: '#c28569', t: '#ead4aa',
  T: '#e4a672', u: '#b86f50', U: '#733e39', p: '#f6757a', P: '#b55088', v: '#68386c',
  e: '#d77643', m: '#ff0044', q: '#f9b4b4', h: '#5d3a28', x: '#fff6d3', z: '#9e2835',
  a: '#a8e04e', i: '#7ad4ff', j: '#4b2a1e', f: '#ffd9a8'
};

// ---------- 像素中文字体 ----------
// 以两倍分辨率渲染系统字体，再做 alpha 阈值化，得到锐利的像素字。
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif';
const textCache = new Map();
function textImg(str, size = 8, color = PAL.k, outline = null, shadow = null) {
  str = String(str);
  const key = str + '|' + size + '|' + color + '|' + outline + '|' + shadow;
  let r = textCache.get(key);
  if (r) return r;
  const fs = size * RS;
  const mc = mkCanvas(4, 4).x;
  mc.font = `bold ${fs}px ${FONT}`;
  const tw = Math.ceil(mc.measureText(str).width) + 2;
  const pad = 4;
  const cw = tw + pad * 2, ch = Math.ceil(fs * 1.3) + pad * 2;
  const c = mkCanvas(cw, ch), x = c.x;
  x.font = `bold ${fs}px ${FONT}`;
  x.textBaseline = 'middle';
  x.fillStyle = '#fff';
  x.fillText(str, pad, ch / 2 + fs * 0.06);
  const id = x.getImageData(0, 0, cw, ch), d = id.data;
  const mask = new Uint8Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) mask[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  const out = x.createImageData(cw, ch), o = out.data;
  const put = (i, hex) => { const v = parseInt(hex.slice(1), 16); o[i * 4] = v >> 16; o[i * 4 + 1] = (v >> 8) & 255; o[i * 4 + 2] = v & 255; o[i * 4 + 3] = 255; };
  if (shadow) {
    for (let y = 0; y < ch; y++) for (let xx = 0; xx < cw; xx++) {
      const sy = y - 2; if (sy >= 0 && mask[sy * cw + xx]) put(y * cw + xx, shadow);
    }
  }
  if (outline) {
    for (let y = 0; y < ch; y++) for (let xx = 0; xx < cw; xx++) {
      if (mask[y * cw + xx]) continue;
      let hit = false;
      for (let dy = -2; dy <= 2 && !hit; dy++) for (let dx = -2; dx <= 2; dx++) {
        if (Math.abs(dx) + Math.abs(dy) > 3) continue;
        const nx = xx + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < cw && ny < ch && mask[ny * cw + nx]) { hit = true; break; }
      }
      if (hit) put(y * cw + xx, outline);
    }
  }
  for (let i = 0; i < cw * ch; i++) if (mask[i]) put(i, color);
  x.putImageData(out, 0, 0);
  r = { c, w: (tw) / RS, h: ch / RS, pad: pad / RS };
  if (textCache.size > 1500) textCache.clear();
  textCache.set(key, r);
  return r;
}
// align: 0 左 0.5 中 1 右；y 为文字垂直中心
function drawText(str, x, y, o = {}) {
  const t = textImg(str, o.size || 8, o.color || PAL.k, o.outline || null, o.shadow || null);
  const ax = o.align === undefined ? 0 : o.align;
  const dx = Math.round((x - t.w * ax - t.pad) * RS) / RS;
  const dy = Math.round((y - t.h / 2) * RS) / RS;
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.drawImage(t.c, dx, dy, t.c.width / RS, t.c.height / RS);
  ctx.globalAlpha = 1;
  return t.w;
}
function textW(str, size = 8) { return textImg(str, size).w; }
// 自动换行（按字符）
function wrapText(str, maxW, size = 8) {
  const lines = []; let cur = '';
  for (const ch of String(str)) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (textW(cur + ch, size) > maxW && cur && !'，。！？、：；）」”…～,.!?'.includes(ch)) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- 输入（多点触控：摇杆独立追踪，其余为主指针） ----------
const input = { down: false, x: 0, y: 0, sx: 0, sy: 0, moved: false, t0: 0, id: null, handlers: null };
const joy = { id: null, dx: 0, dy: 0, mag: 0, kx: 0, ky: 0, lastT: -99 };
function toLogicalXY(cx, cy) {
  const r = cv.getBoundingClientRect();
  return [(cx - r.left) / r.width * W, (cy - r.top) / r.height * H];
}
function pDown(id, cx, cy) {
  const [x, y] = toLogicalXY(cx, cy);
  if (typeof Audio_ !== 'undefined' && typeof UI !== 'undefined' && !UI.title) Audio_.unlock();
  if (joy.id === null && typeof joyCapture === 'function' && joyCapture(x, y)) { joy.id = id; joyMove(x, y); return; }
  if (input.down) return;
  Object.assign(input, { down: true, x, y, sx: x, sy: y, moved: false, t0: performance.now(), id });
  if (input.handlers) input.handlers.down(x, y);
}
function pMove(id, cx, cy) {
  const [x, y] = toLogicalXY(cx, cy);
  if (id === joy.id) { joyMove(x, y); return; }
  if (!input.down || id !== input.id) return;
  input.x = x; input.y = y;
  if (!input.moved && dist(x, y, input.sx, input.sy) > 5) input.moved = true;
  if (input.handlers) input.handlers.move(x, y);
}
function pUp(id, cx, cy, cancel) {
  if (id === joy.id) { joy.id = null; joy.dx = joy.dy = joy.mag = 0; return; }
  if (!input.down || id !== input.id) return;
  const [x, y] = toLogicalXY(cx, cy);
  input.down = false; input.x = x; input.y = y;
  if (input.handlers) input.handlers.up(x, y, cancel);
}
function joyMove(x, y) {
  const c = JOY_POS, dx = x - c.x, dy = y - c.y, d = Math.hypot(dx, dy), r = c.r;
  const k = d > r ? r / d : 1;
  joy.kx = dx * k; joy.ky = dy * k;
  joy.mag = Math.min(1, d / r);
  joy.dx = d > 0 ? dx / d : 0; joy.dy = d > 0 ? dy / d : 0;
  joy.lastT = performance.now();
}
const JOY_POS = { x: 40, y: 352, r: 22 };
function joyCapture(x, y) {
  if (typeof UI === 'undefined' || UI.title || !UI.joyShown) return false;
  const h = uiHitAt(x, y); return !!(h && h.id === 'joy');
}
if (window.PointerEvent) {
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} pDown(e.pointerId, e.clientX, e.clientY); }, { passive: false });
  cv.addEventListener('pointermove', e => { e.preventDefault(); pMove(e.pointerId, e.clientX, e.clientY); }, { passive: false });
  cv.addEventListener('pointerup', e => { e.preventDefault(); pUp(e.pointerId, e.clientX, e.clientY, false); }, { passive: false });
  cv.addEventListener('pointercancel', e => { pUp(e.pointerId, e.clientX, e.clientY, true); }, { passive: false });
  cv.addEventListener('lostpointercapture', e => { if (e.pointerId === joy.id) pUp(e.pointerId, 0, 0, true); });
} else {
  // 旧版安卓 WebView 兜底：触摸事件
  const each = (e, f) => { e.preventDefault(); for (const t of e.changedTouches) f(t); };
  cv.addEventListener('touchstart', e => each(e, t => pDown(t.identifier, t.clientX, t.clientY)), { passive: false });
  cv.addEventListener('touchmove', e => each(e, t => pMove(t.identifier, t.clientX, t.clientY)), { passive: false });
  cv.addEventListener('touchend', e => each(e, t => pUp(t.identifier, t.clientX, t.clientY, false)), { passive: false });
  cv.addEventListener('touchcancel', e => each(e, t => pUp(t.identifier, t.clientX, t.clientY, true)), { passive: false });
  cv.addEventListener('mousedown', e => pDown('m', e.clientX, e.clientY));
  addEventListener('mousemove', e => pMove('m', e.clientX, e.clientY));
  addEventListener('mouseup', e => pUp('m', e.clientX, e.clientY, false));
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.target === cv || e.touches.length > 1) e.preventDefault(); }, { passive: false });
['touchend', 'mouseup', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, () => { if (typeof Audio_ !== 'undefined' && typeof UI !== 'undefined' && !UI.title) Audio_.unlock(); }, { passive: true }));
addEventListener('blur', () => { joy.id = null; joy.mag = 0; });

// ---------- 存储（容错） ----------
const Store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (_) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} }
};

// ============================================================
//  像素精灵：ASCII 手绘 + 自动描边
// ============================================================
function spr(rows, o = {}) {
  const pal = Object.assign({}, PAL, o.pal || {});
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const ol = o.outline === false ? 0 : 1;
  const oc = o.outline === false ? null : (o.outline ? (PAL[o.outline] || o.outline) : PAL.K);
  const c = mkCanvas(w + ol * 2, h + ol * 2), x = c.x;
  const filled = (gx, gy) => gx >= 0 && gy >= 0 && gx < w && gy < h && rows[gy][gx] && rows[gy][gx] !== '.' && rows[gy][gx] !== ' ';
  for (let gy = 0; gy < h; gy++) for (let gx = 0; gx < w; gx++) {
    const ch = rows[gy][gx];
    if (!ch || ch === '.' || ch === ' ') continue;
    x.fillStyle = pal[ch] || '#f0f'; x.fillRect(gx + ol, gy + ol, 1, 1);
  }
  if (ol) {
    x.fillStyle = oc;
    for (let gy = -1; gy <= h; gy++) for (let gx = -1; gx <= w; gx++) {
      if (filled(gx, gy)) continue;
      if (filled(gx - 1, gy) || filled(gx + 1, gy) || filled(gx, gy - 1) || filled(gx, gy + 1) ||
        (o.diag && (filled(gx - 1, gy - 1) || filled(gx + 1, gy - 1) || filled(gx - 1, gy + 1) || filled(gx + 1, gy + 1))))
        x.fillRect(gx + ol, gy + ol, 1, 1);
    }
  }
  return { c, w: c.width, h: c.height, ol };
}
function flipped(s) {
  if (s.f) return s.f;
  const c = mkCanvas(s.c.width, s.c.height);
  c.x.translate(c.width, 0); c.x.scale(-1, 1); c.x.drawImage(s.c, 0, 0);
  s.f = { c, w: s.w, h: s.h, ol: s.ol }; return s.f;
}
// 在 (x,y) 绘制，x,y 为精灵（不含描边）的左上角
function dspr(s, x, y, flip = false, alpha = 1) {
  if (!s) return;
  const t = flip ? flipped(s) : s;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(t.c, Math.round(x) - t.ol, Math.round(y) - t.ol);
  if (alpha !== 1) ctx.globalAlpha = 1;
}
// 以底部中心为锚点
function dsprBC(s, cx, by, flip = false, alpha = 1) { dspr(s, cx - (s.w - s.ol * 2) / 2, by - (s.h - s.ol * 2), flip, alpha); }
// 缩放绘制（图标放大）
function dsprScaled(s, cx, cy, scale = 1, alpha = 1) {
  if (!s) return;
  const w = s.w * scale, h = s.h * scale;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(s.c, Math.round(cx - w / 2), Math.round(cy - h / 2), w, h);
  if (alpha !== 1) ctx.globalAlpha = 1;
}

const SPR = {};

  };
  const cheer = down.slice(); cheer[8] = "srrbrrrrbrrs"; cheer[9] = ".rrbbbbbbrr."; cheer[7] = "s..ssssss..s";

  return set;
}

// ============================================================
//  程序化像素图形：地块、树木、建筑、机器、装饰
// ============================================================
function G(w, h) {
  const c = mkCanvas(w, h), x = c.x;
  return {
    c, x,
    r(px, py, pw, ph, col) { x.fillStyle = col; x.fillRect(px, py, pw, ph); },
    p(px, py, col) { x.fillStyle = col; x.fillRect(px, py, 1, 1); },
    circ(cx, cy, rad, col) { x.fillStyle = col; for (let yy = -rad; yy <= rad; yy++) for (let xx = -rad; xx <= rad; xx++) if (xx * xx + yy * yy <= rad * rad + rad * 0.8) x.fillRect(cx + xx, cy + yy, 1, 1); },
    ell(cx, cy, rx, ry, col) { x.fillStyle = col; for (let yy = -ry; yy <= ry; yy++) for (let xx = -rx; xx <= rx; xx++) if ((xx * xx) / (rx * rx + 0.5) + (yy * yy) / (ry * ry + 0.5) <= 1) x.fillRect(cx + xx, cy + yy, 1, 1); },
    spr(s, px, py) { x.drawImage(s.c, px - s.ol, py - s.ol); }
  };
}
// 给程序化图形描边（扩大 1 像素）
function outlined(c, col = PAL.K, diag = false) {
  const w = c.width, h = c.height;
  const src = c.getContext('2d').getImageData(0, 0, w, h).data;
  const o = mkCanvas(w + 2, h + 2);
  o.x.drawImage(c, 1, 1);
  const a = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 0;
  o.x.fillStyle = col;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    if (a(x, y)) continue;
    if (a(x - 1, y) || a(x + 1, y) || a(x, y - 1) || a(x, y + 1) || (diag && (a(x - 1, y - 1) || a(x + 1, y - 1) || a(x - 1, y + 1) || a(x + 1, y + 1)))) o.x.fillRect(x + 1, y + 1, 1, 1);
  }
  return { c: o, w: o.width, h: o.height, ol: 1 };
}
const asSpr = c => ({ c, w: c.width, h: c.height, ol: 0 });

function inRect(x, y, r) { return x >= r.x && y >= r.y && x < r.x + r.w && y < r.y + r.h; }
function plotAt(x, y) { for (let i = 0; i < PLOTS.length; i++) if (inRect(x, y, PLOTS[i])) return i; return -1; }

  if (x > c.x && y > c.y && x < c.x + c.w - 1 && y < c.y + c.h - 1) return 'coop';

}

// ---------------- 新游戏 ----------------
function newState() {
  const st = {
    v: 3, coins: 150, xp: 0, lv: 1, day: 1, time: DAY_START + 30, weather: 'sun',
    tool: 'hoe', seedSel: 'turnip', water: 20, can2: false,
    inv: { seed_turnip: 8, seed_wheat: 4 },
    ground: new Array(MW * MH).fill(0), wet: new Array(MW * MH).fill(0), fert: new Array(MW * MH).fill(0),
    crops: {}, objs: {}, plots: PLOTS.map((p, i) => i === 0), machines: {}, animals: [],
    troughs: { coop: 0, barn: 0 },
    trees: [{ x: 12, y: 4, type: 'apple', n: 3 }, { x: 14, y: 4, type: 'peach', n: 2 }],
    orders: [null, null, null], orderCD: [0, 0, 0], orderSeq: 0,
    quest: { i: 0, p: 0 }, goal: null, stats: { harvest: 0, orders: 0, earn: 0, fish: 0, craft: 0, collect: 0 },
    earnedToday: 0, settings: { music: true, sfx: true, joy: true },
    px: 5 * TS + 8, py: 7 * TS + 10, started: Date.now()
  };
  const g = st.ground, R = mulberry(20261120);
  const set = (x, y, v) => { if (inMap(x, y)) g[idx(x, y)] = v; };
  // 道路
  for (let x = 1; x < MW - 1; x++) set(x, 6, GR.PATH);
  for (let y = 6; y < 37; y++) set(11, y, GR.PATH);
  for (let x = 11; x < 28; x++) set(x, 22, GR.PATH);
  for (let x = 12; x < 28; x++) for (let y = 7; y <= 9; y++) set(x, y, GR.PATH);
  set(5, 5, GR.PATH);
  for (let x = 17; x <= 22; x++) set(x, 5, GR.PATH);
  // 池塘
  for (let y = 23; y <= 32; y++) for (let x = 13; x <= 22; x++) {
    const dx = (x - 17.5) / 4.6, dy = (y - 27.6) / 3.9;
    const wob = 0.1 * Math.sin(x * 1.3 + y * 0.7);
    if (dx * dx + dy * dy <= 1 + wob) set(x, y, GR.WATER);
  }
  // 河流
  for (let x = 0; x < MW; x++) for (let y = 37; y < MH; y++) set(x, y, GR.WATER);
  for (let y = 37; y < MH; y++) set(11, y, GR.PLANK);
  // 沙滩
  const isW = (x, y) => inMap(x, y) && g[idx(x, y)] === GR.WATER;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (g[idx(x, y)] !== GR.GRASS) continue;
    let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (isW(x + dx, y + dy)) n++;
    if (n && y < 36) g[idx(x, y)] = GR.SAND;
    if (n && y === 36) g[idx(x, y)] = GR.SAND;
  }
  // 物件
  const O = st.objs, put = (x, y, o) => { O[idx(x, y)] = o; };
  for (let y = 0; y < 37; y++) { put(0, y, { t: hash2(0, y) < 0.5 ? 'pine' : 'tree', v: y }); put(MW - 1, y, { t: hash2(29, y) < 0.5 ? 'pine' : 'tree', v: y + 40 }); }
  for (let x = 1; x < MW - 1; x++) put(x, 0, { t: hash2(x, 0) < 0.55 ? 'pine' : 'tree', v: x + 80 });
  [[9, 2], [24, 3], [26, 1], [27, 4], [18, 11], [13, 33], [16, 34], [20, 35], [25, 35], [27, 33], [2, 36], [8, 36], [1, 2], [23, 1]].forEach(([x, y], i) => {
    if (g[idx(x, y)] === GR.GRASS && !O[idx(x, y)]) put(x, y, { t: i % 3 === 1 ? 'pine' : 'tree', v: 200 + i });
  });
  [[17, 11], [19, 12], [25, 5], [28, 23], [12, 34], [6, 35], [9, 35], [14, 36], [22, 36], [10, 2]].forEach(([x, y], i) => {
    if (g[idx(x, y)] === GR.GRASS && !O[idx(x, y)]) put(x, y, { t: 'bush', v: i, b: i % 3 === 0 });
  });
  // 栅栏
  const fenceRect = (r) => {
    for (let x = r.x; x < r.x + r.w; x++) for (let y = r.y; y < r.y + r.h; y++) {
      if (x !== r.x && y !== r.y && x !== r.x + r.w - 1 && y !== r.y + r.h - 1) continue;
      if (r.gaps.some(([gx, gy]) => gx === x && gy === y)) continue;
      put(x, y, { t: 'fence' });
    }
  };
  fenceRect(LAYOUT.coopPen); fenceRect(LAYOUT.barnPen);
  // 地块：已解锁的放些杂草，未解锁的长满灌木
  PLOTS.forEach((p, i) => {
    for (let y = p.y; y < p.y + p.h; y++) for (let x = p.x; x < p.x + p.w; x++) {
      if (g[idx(x, y)] !== GR.GRASS) continue;
      const r = R();
      if (i === 0) { if (r < 0.12) put(x, y, { t: 'weed', v: Math.floor(R() * 3) }); else if (r < 0.16) put(x, y, { t: 'rock', v: Math.floor(R() * 2) }); else if (r < 0.18) put(x, y, { t: 'stump' }); }
      else put(x, y, r < 0.55 ? { t: 'bush', v: Math.floor(R() * 9), lock: i } : r < 0.75 ? { t: 'rock', v: Math.floor(R() * 2), lock: i } : r < 0.9 ? { t: 'weed', v: Math.floor(R() * 3), lock: i } : { t: 'stump', lock: i });
    }
    if (i > 0) put(p.x + Math.floor(p.w / 2), p.y, { t: 'sign', lock: i });
  });
  // 初始道具摆设
  put(9, 7, { t: 'flowerpot', v: 0 }); put(2, 7, { t: 'flowerpot', v: 1 });
  return st;
}

// ---------------- 阻挡 ----------------
const BLOCKING = { tree: 1, pine: 1, rock: 1, stump: 1, bush: 1, fence: 1, sign: 1, sprinkler: 1, sprinkler2: 1, lamp: 1, scarecrow: 1, flowerpot: 1, bench: 1, gnome: 1 };
function isStatic(x, y) {
  for (const k of ['house', 'coop', 'barn', 'shop']) if (inRect(x, y, LAYOUT[k])) return k;
  for (const k of ['well', 'board', 'bin', 'doghouse']) if (LAYOUT[k].x === x && LAYOUT[k].y === y) return k;
  for (const k of ['coopTrough', 'barnTrough']) { const t = LAYOUT[k]; if (y === t.y && (x === t.x || x === t.x + 1)) return k; }
  for (const t of S.trees) if (t.x === x && t.y === y) return 'fruittree';
  for (let i = 0; i < SLOTS.length; i++) if (SLOTS[i].x === x && SLOTS[i].y === y && S.machines[i]) return 'machine';
  return null;
}
function rebuildBlock() {
  const b = RT.block;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = idx(x, y), gr = S.ground[i], o = S.objs[i];
    b[i] = (gr === GR.WATER) || (o && BLOCKING[o.t]) || isStatic(x, y) ? 1 : 0;
  }
}
const walkable = (x, y) => inMap(x, y) && !RT.block[idx(x, y)];

// ---------------- 寻路 (Dijkstra, 8 方向) ----------------
function findPath(sx, sy, goals) {
  if (goals.has(idx(sx, sy))) return [];
  const N = MW * MH, distA = new Float32Array(N).fill(1e9), prev = new Int32Array(N).fill(-1);
  const heap = []; const push = (d, i) => { heap.push([d, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break;[heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (; ;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break;[heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
  const s = idx(sx, sy); distA[s] = 0; push(0, s);
  let found = -1;
  while (heap.length) {
    const [d, i] = pop(); if (d > distA[i]) continue;

// ---------------- 玩家更新 ----------------
function updatePlayer(dt) {
  if (P.act) {
    P.act.t += dt;
    if (P.act.t >= P.act.dur) P.act = null;
    return;
  }
  if (FISH_ST) return;
  P.joyWalk = false;
  if (joyActive() && !UI.seedPicker) {
    if (P.path && P.path.length) clearQueue();
    if (!P.cur && !P.queue.length) { joyStep(dt); return; }
  }
  if (!P.cur) startNextAction();
  if (!P.cur) { P.frame = 0; return; }
  if (P.path && P.path.length) {
    if (joyActive()) { clearQueue(); return; }
    const [tx, ty] = P.path[0];
    const [cx, cy] = tileCenter(tx, ty);
    const dx = cx - P.x, dy = cy - P.y, d = Math.hypot(dx, dy);
    const step = P.speed * dt;
    if (d <= step) { P.x = cx; P.y = cy; P.path.shift(); }
    else { P.x += dx / d * step; P.y += dy / d * step; }
    if (Math.abs(dx) > Math.abs(dy) + 0.5) { P.dir = 'side'; P.flip = dx < 0; } else if (Math.abs(dy) > 0.5) { P.dir = dy < 0 ? 'up' : 'down'; P.flip = false; }
    P.animT += dt; if (P.animT > 0.13) { P.animT = 0; P.frame = P.frame === 1 ? 2 : 1; if (S.ground[idx(...tileOf(P.x, P.y))] !== GR.GRASS || Math.random() < 0.5) sfx('step', { vol: 0.15 }); }
    CAM.free = false;
    return;
  }
  // 到达
  const a = P.cur; P.cur = null; P.frame = 0;
  if (stillValid(a)) performAction(a);
}
function updateDog(dt) {

  let tx, ty;
  if (night) { tx = dh.x * TS + 8; ty = (dh.y + 1) * TS + 6; DOG.state = 'sleep'; }
  else { DOG.state = 'follow'; tx = P.x + (P.flip ? 16 : -16); ty = P.y + 4; }
  const dx = tx - DOG.x, dy = ty - DOG.y, d = Math.hypot(dx, dy);
  if (d > 30 || (night && d > 2)) {
    const sp = d > 80 ? 110 : 70;
    DOG.x += dx / d * Math.min(sp * dt, d); DOG.y += dy / d * Math.min(sp * dt, d);
    if (Math.abs(dx) > 1) DOG.flip = dx < 0;
    DOG.animT += dt; if (DOG.animT > 0.12) { DOG.animT = 0; DOG.frame = 1 - DOG.frame; }
    DOG.moving = true; DOG.idleT = 0;
  } else { DOG.moving = false; DOG.idleT = (DOG.idleT || 0) + dt; }

}

}

// ---------------- 世界点击 ----------------
function staticHit(wx, wy) {

  const R = (k, x, y, w, h) => (wx >= x && wx < x + w && wy >= y && wy < y + h) ? k : null;
  return R('house', 48, 18, 80, 76) || R('shop', 286, 24, 66, 56) || R('barn', 333, 152, 70, 72) || R('coop', 206, 152, 52, 56) ||
    R('bin', 126, 78, 20, 18) || R('board', 251, 66, 26, 30) || R('well', 157, 50, 22, 30) || R('doghouse', 14, 76, 20, 20);
}
function worldTap(sx, sy, opts = {}) {

  const tx = Math.floor(wx / TS), ty = Math.floor(wy / TS);
  const tool = opts.tool || S.tool;
  if (FISH_ST) { fishTap(); return true; }
  if (PLACE && !opts.btn) { placeAt(tx, ty); return true; }
  // 动物（按钮操作时放宽判定）
  let an = animalHit(wx, wy);
  if (!an && opts.loose) { let bd = 20; for (const a of S.animals) { const d = dist(a.x, a.y - 5, wx, wy); if (d < bd) { bd = d; an = a; } } }
  if (an) { clearQueue(); queueAction({ type: 'animal', animal: an, tx: Math.floor(an.x / TS), ty: Math.floor((an.y - 1) / TS) }); tapFx(wx, wy); return true; }
  // 机器
  for (let i = 0; i < SLOTS.length; i++) {
    const sl = SLOTS[i], x0 = sl.x * TS - 2, y0 = sl.y * TS - 14;
    if (wx >= x0 && wx < x0 + 20 && wy >= y0 && wy < y0 + 30) {
      sfx('click');
      if (S.machines[i]) { if (S.machines[i].out.length) { const n = machineCollect(i); if (n) { UI.toast('收取了 ' + n + ' 件产品'); return true; } } UI.openMachine(i); }
      else UI.openShop(2);
      return true;
    }
  }
  // 果树
  for (const t of S.trees) {
    if (wx >= t.x * TS - 9 && wx < t.x * TS + 25 && wy >= t.y * TS - 28 && wy < (t.y + 1) * TS) { clearQueue(); queueAction({ type: 'fruit', tree: t, tx: t.x, ty: t.y }); tapFx(wx, wy); return true; }
  }
  // 饲料槽
  for (const home of ['coop', 'barn']) {
    const t = troughTile(home);
    if (ty === t.y && (tx === t.x || tx === t.x + 1)) { clearQueue(); queueAction({ type: 'trough', home, tx, ty }); tapFx(wx, wy); return true; }
  }
  const sh = staticHit(wx, wy);
  if (sh && sh !== 'doghouse') {
    sfx('click');
    if (sh === 'shop') UI.openShop(0);
    else if (sh === 'bin') { binOpenT = 0.6; UI.openBag(true); }
    else if (sh === 'board') UI.openOrders();
    else if (sh === 'house') UI.sleepPrompt();
    else if (sh === 'well') { clearQueue(); queueAction({ type: 'well', tx: LAYOUT.well.x, ty: LAYOUT.well.y, stand: [[10, 5], [9, 5], [11, 5], [9, 4], [11, 4]] }); tapFx(wx, wy); }
    else if (sh === 'coop' || sh === 'barn') UI.openShop(1);
    return true;
  }
  // 地块动作（优先于小狗和村民，避免误点）
  const a = resolveTileAction(tx, ty, tool, !!opts.quiet);
  if (a && a.type === 'lockplot') { UI.plotPrompt(a.plot); return true; }
  if (a) {
    if (!dragState.active) clearQueue();
    queueAction(a); tapFx(wx, wy);
    return true;
  }
  // 村民 / 小狗（最低优先级，判定范围更小）
  const npc = npcHit(wx, wy);
  if (npc) { talkNPC(npc); return true; }
  if (dist(wx, wy, DOG.x, DOG.y - 4) < 7 || sh === 'doghouse') { DOG.heart = 1.2; heartFx(DOG.x, DOG.y - 12); sfx('woof'); return true; }
  if (opts.noWalk) return false;
  // 空地：走过去
  if (walkable(tx, ty)) {
    clearQueue();
    const [px, py] = tileOf(P.x, P.y);
    const path = findPath(px, py, new Set([idx(tx, ty)]));
    if (path) { P.cur = { type: 'walk', tx, ty }; P.path = path; tapFx(wx, wy, true); }
  }
  return false;
}
// ---------------- 摇杆 / 功能键 ----------------
function frontTile() {

}

}

}

  if (an) return R(an.ready ? ICON[ANIMALS[an.type].product] : ICON.heart, () => performAction({ type: 'animal', animal: an, tx: fx, ty: fy }));

    case 'bin': return R(ICON.coin, () => { sfx('click'); binOpenT = 0.6; UI.openBag(true); });
    case 'board': return R(ICON.u_scroll, () => { sfx('click'); UI.openOrders(); });

  } else {

}

function worldDown(sx, sy) {

function worldDrag(sx, sy) {

  if (!dragState.active && !dragState.pan) {

function nightAmount() {

  if (h < 17.5) return 0;
  if (h < 19.5) return (h - 17.5) / 2 * 0.45;
  if (h < 21) return 0.45 + (h - 19.5) / 1.5 * 0.25;

}
function drawLighting() {

  if (h < 7.2) { const k = 1 - (h - 6) / 1.2; ctx.fillStyle = `rgba(254,174,52,${0.12 * k})`; ctx.fillRect(0, 0, W, H); }

  for (const i in S.machines) { const m = S.machines[i]; if (m.q.length && (m.id === 'oven' || m.id === 'jam')) L(SLOTS[i].x * TS + 8, SLOTS[i].y * TS + 4, 22); }
  if (FX.flies) for (const f of FX.flies) L(f.x, f.y, 5);
  lc.globalCompositeOperation = 'destination-out';
  for (const [x, y, r] of lights) {

      lc.globalAlpha = a; lc.beginPath(); lc.arc(Math.round(x), Math.round(y), Math.round(r * f), 0, Math.PI * 2); lc.fill();

  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

  else if (f.phase === 'hold') { if (f.t > 2.4) { f.phase = 'in'; f.t = 0; } }
  else if (f.phase === 'in' && f.t > 0.8) { UI.fade = null; if (f.info && f.info.passedOut) UI.toast('太晚了！你累得睡着了…'); return; }

    const ta = f.phase === 'hold' ? Math.min(1, f.t * 3) : 1 - f.t / 0.4;
    // 星星
    for (let k = 0; k < 30; k++) { const x = hash2(k, 1) * W, y = hash2(k, 2) * H * 0.6; ctx.globalAlpha = ta * (0.4 + Math.sin(gameT * 3 + k) * 0.3); ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }

    drawText(`第${year()}年 · ${SEASONS[curSeason()]}季 · 第${dayOfSeason()}天`, W / 2, H / 2 - 18, { size: 8, color: sc, align: 0.5, alpha: ta });

// ---------------- 输入路由 ----------------
function uiHitAt(x, y) {
  for (let k = UI.hits.length - 1; k >= 0; k--) {
    const h = UI.hits[k];
    if (h.clip && !(x >= h.clip.x && x < h.clip.x + h.clip.w && y >= h.clip.y && y < h.clip.y + h.clip.h)) continue;
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) return h;
  }
  return null;
}
let downTarget = null;
input.handlers = {
  down(x, y) {
    const h = uiHitAt(x, y);
    UI.sdrag = null;
    if (h) {
      downTarget = 'ui'; UI.pressed = h.id;
      if (h.onDown && h.fn) { h.fn(); h.fired = true; UI.firedId = h.id; }
      // 查找该位置所在的滚动区
      for (let k = UI.hits.length - 1; k >= 0; k--) { const s = UI.hits[k]; if (s.scroll && x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) { UI.sdrag = { key: s.scroll.key, maxS: s.scroll.maxS, y0: y, s0: UI.scroll[s.scroll.key] || 0, active: false }; break; } }
      return;
    }
    if (UI.seedPicker) { UI.seedPicker = false; downTarget = 'none'; return; }
    downTarget = 'world';
  },
  move(x, y) {
    if (downTarget === 'ui' && UI.sdrag) {
      const d = y - UI.sdrag.y0;
      if (Math.abs(d) > 4) UI.sdrag.active = true;
      if (UI.sdrag.active) { UI.scroll[UI.sdrag.key] = clamp(UI.sdrag.s0 - d, 0, UI.sdrag.maxS); UI.pressed = null; }
      return;
    }

  },
  up(x, y, cancel) {
    if (downTarget === 'ui') {
      const h = uiHitAt(x, y);
      if (!cancel && h && h.id === UI.pressed && h.fn && !h.onDown && UI.firedId !== h.id && !(UI.sdrag && UI.sdrag.active)) h.fn();
      const ph = UI.hits.find(q => q.id === UI.pressed);
      if (ph && ph.onUp) ph.onUp();
      UI.firedId = null;
      UI.pressed = null; UI.sdrag = null;
    } else if (downTarget === 'world') {
      // 场景中的房屋、人物、动物、植物只能用摇杆 + 互动按钮操作
      if (!cancel && !UI.title && gameT - lastHintT > 4) { lastHintT = gameT; UI.toast('用左下摇杆走过去，再按右侧按钮互动'); }
    }
    downTarget = null;
  }
};

  ctx.fillStyle = 'rgba(24,20,37,0.35)'; ctx.fillRect(30, gy + 2, W - 60, 3);
  const bob = k => Math.round(Math.abs(Math.sin(TITLE.t * 3 + k)) * -3);
  dsprBC(SPR.chicken[Math.floor(TITLE.t * 4) % 2], 44, gy + bob(0));
  dsprBC(SPR.cow[0], 76, gy + bob(1));
  dsprBC(SPR.far.cheer, W / 2, gy + bob(2));
  dsprBC(SPR.sheep[0], 140, gy + bob(3), true);
  dsprBC(SPR.dog[Math.floor(TITLE.t * 5) % 2], 172, gy + bob(4), true);
  ['turnip', 'carrot', 'tomato', 'strawberry', 'pumpkin', 'corn', 'watermelon'].forEach((k, j) => {
    const a = TITLE.t * 0.7 + j * 0.9;
    dsprScaled(ICON[k], W / 2 + Math.cos(a) * 92, 176 + Math.sin(a) * 10, 1);
  });
  // 按钮（触屏点击或摇杆 + A 键）
  const B = (id, y, label, col, fn) => {
    const x = 48, w = W - 96, h = 26, pr = hit(id, x, y, w, h, () => { sfx('select'); fn(); });
    drawBtn(x, y, w, h, col, pr); drawText(label, W / 2, y + 12 + (pr ? 1 : 0), { size: 9, color: '#ffffff', outline: BTN_C[col][0], align: 0.5 });
  };
  if (TITLE.hasSave) {
    B('title_main', 196, '继续游戏', 'green', () => startGame(false));
    B('title_new', 230, '新的开始', 'yellow', () => { if (TITLE.confirmNew) startGame(true); else { TITLE.confirmNew = true; } });
    if (TITLE.confirmNew) drawText('再按一次将清除旧存档', W / 2, 264, { size: 6.5, color: '#f6757a', outline: PAL.K, align: 0.5 });
  } else B('title_main', 210, '开始游戏', 'green', () => startGame(true));
  drawText('摇杆选择 · 按钮确认 · 自动存档', W / 2, DECK_Y - 10, { size: 6, color: '#c0cbdc', outline: PAL.K, align: 0.5 });
  drawText('v1.3', W - 6, DECK_Y - 10, { size: 5, color: '#8b9bb4', align: 1 });
}
function startGame(fresh) {
  Audio_.unlock();
  if (fresh) { Store.del(SAVE_KEY); S = newState(); }
  initWorld();
  UI.title = false;
  if (fresh) showIntro();
  else UI.toast(`欢迎回来！今天是${SEASONS[curSeason()]}季第${dayOfSeason()}天`);
}

// ---------------- 主循环 ----------------
let lastT = performance.now(), saveT = 0;
function update(dt) {
  const paused = !!(UI.modal || UI.popup || UI.fade);
  if (!paused) {
    const dm = dt * MIN_PER_SEC * timeScale;
    S.time += dm;
    advanceTime(dm);
    updateAnimals(dt, dm);
    updatePlayer(dt);
    updateFishing(dt);
    updateNPCs(dt);
    if (S.time >= DAY_END) startSleep(true);
  } else updateAnimals(dt, 0);
  updateDog(dt);
  updateFx(dt);
  updateCamera(dt);
  if (binOpenT > 0 && !(UI.modal && UI.modal.type === 'bag' && UI.bagSell)) binOpenT -= dt;
  saveT += dt; if (saveT > 15) { saveT = 0; saveGame(); }
}
function render(dt) {
  drawWorld(dt);
  drawWeather(dt);
  drawLighting();
  drawHUD(dt);
  drawFishGame();
  drawModal(dt);
  drawOverlays(dt);
  drawDeck(dt);
  buildNav(); navStep(dt);
  drawFocus(dt);
  drawFade(dt);
}
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.05);
  gameT += dt;
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  UI.hits = [];
  try {
    if (UI.title) { drawTitle(dt); drawDeck(dt); buildNav(); navStep(dt); drawFocus(dt); }
    else { update(dt); render(dt); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
addEventListener('pagehide', () => saveGame());

// ---------------- 原生壳 / PWA 钩子 ----------------
window.__appPause = () => { try { saveGame(); if (Audio_.ctx) Audio_.ctx.suspend(); joy.id = null; joy.mag = 0; } catch (_) { } };
window.__appResume = () => { try { if (Audio_.ctx && !UI.title) Audio_.ctx.resume(); } catch (_) { } };
if (window.__PWA__ && 'serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (_) { }
}

// ---------------- 启动 ----------------
(function boot() {
  const saved = loadGame();
  TITLE.hasSave = !!saved;
  S = saved || newState();
  initWorld();
  requestAnimationFrame(frame);
})();

</script>
</body>
